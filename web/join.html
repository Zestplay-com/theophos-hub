<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/auth.css"><title>Join Theophos Hub</title></head><body><main class="auth-page"><a class="logo" href="index.html">theophos<span>hub</span></a><section class="auth-card"><div class="eyebrow">JOIN THE CREATOR COMMUNITY</div><h1>Create your creator profile.</h1><p>Start with your identity, niche and goals. You can change them later.</p><label>Display name<input id="name" placeholder="Your creator name"></label><label>Email<input id="email" type="email" placeholder="you@example.com"></label><label>Password<input id="password" type="password" minlength="6" placeholder="At least 6 characters"></label><label>YouTube channel URL <span class="optional">optional</span><input id="channel" type="url" placeholder="https://youtube.com/@yourchannel"></label><label>Primary niche<select id="niche"><option value="">Choose your niche</option><option>Finance</option><option>Gospel / Christian</option><option>Gaming</option><option>Technology</option><option>Education</option><option>Business</option><option>Motivation</option><option>Lifestyle</option><option>Fitness</option><option>African Creators</option><option>Other</option></select></label><div id="message" class="message" hidden></div><button class="btn btn-primary full" id="joinBtn">Create creator account →</button><p class="switch">Already have an account? <a href="login.html">Sign in</a></p></section></main><script type="module" src="js/auth.js"></script></body></html>
