<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081225"><title>Support Creator — Theophos Hub</title><link rel="stylesheet" href="css/app.css"></head><body class="app-page"><header class="app-header page-width"><a class="brand" href="index.html">theophos<span>hub</span></a><nav><a href="dashboard.html">Home</a><a class="active" href="discover.html">Discover</a><a href="submit.html">Submit</a><a href="profile.html">Profile</a></nav><button class="btn btn-ghost" data-logout>Sign out</button></header><main class="page-width app-content"><section class="auth-card" style="width:min(760px,100%);margin:auto"><div class="eyebrow">SUPPORT MISSION</div><h1>Give feedback that can actually help.</h1><p>You are not here to manufacture engagement. You are here to help another creator see their content from a fresh perspective.</p><form id="supportForm"><div class="quick-grid" style="grid-template-columns:1fr 1fr"><div><label>Overall<select id="rating"><option value="5">5 — Excellent</option><option value="4">4 — Strong</option><option value="3">3 — Good with room to improve</option><option value="2">2 — Needs work</option><option value="1">1 — Needs major improvement</option></select></label></div><div><label>Hook<select id="hook"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label></div><div><label>Title<select id="titleRating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label></div><div><label>Value<select id="value"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label></div><div><label>CTA<select id="cta"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label></div></div><label>Your feedback<textarea id="feedback" rows="6" required minlength="15" placeholder="What worked? What could be clearer? Give the creator one practical improvement..."></textarea></label><div id="supportStatus" class="form-success" hidden></div><button class="btn btn-primary full" type="submit">Send meaningful feedback →</button></form></section></main><script src="js/config.js"></script><script type="module">import {protectPage,bindLogout} from './js/app-static.js';protectPage();bindLogout();</script><script type="module" src="js/support-static.js"></script></body></html>
