<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/app.css"><title>Support creator — Theophos Hub</title></head><body><main class="app-page"><header class="app-header"><a class="brand" href="index.html">theophos<span>hub</span></a><nav><a href="dashboard.html">Home</a><a href="discover.html">Discover</a><a class="active" href="discover.html">Support</a><a href="profile.html">Profile</a></nav></header><section class="app-shell"><div id="supportCard" class="form-card"><div class="eyebrow">MEANINGFUL FEEDBACK</div><h2 id="videoTitle">Creator video</h2><p id="videoDescription">Watch or discover the creator's content, then share feedback you genuinely believe will help.</p><a id="videoLink" class="btn btn-primary" target="_blank" rel="noopener">Open YouTube video ↗</a><div class="feedback-grid"><label>Hook <select id="hook"><option value="">Rate</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>Title <select id="titleRating"><option value="">Rate</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>Value <select id="valueRating"><option value="">Rate</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>Presentation <select id="presentation"><option value="">Rate</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label></div><label>Useful feedback<textarea id="comment" placeholder="What worked? What could be clearer? Keep it specific and respectful."></textarea></label><p id="supportMessage" class="message"></p><button class="btn btn-primary" id="send">Send feedback →</button></div></section></main><script type="module" src="js/support.js"></script></body></html>
