<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081225"><title>Creator Profile — Theophos Hub</title><link rel="stylesheet" href="css/app.css"></head><body class="app-page"><header class="app-header page-width"><a class="brand" href="index.html">theophos<span>hub</span></a><nav><a href="dashboard.html">Home</a><a href="discover.html">Discover</a><a href="submit.html">Submit</a><a class="active" href="profile.html">Profile</a></nav><button class="btn btn-ghost" data-logout>Sign out</button></header><main class="page-width app-content"><div class="dashboard-welcome"><div><div class="eyebrow">YOUR CREATOR IDENTITY</div><h1>Build a profile people can understand.</h1><p>Tell the community what you create and where they can find your channel.</p></div><a class="btn btn-primary" href="submit.html">Submit content →</a></div><div class="app-grid"><section class="app-card" style="padding:28px"><form id="profileForm"><label>Display name<input id="displayName" required placeholder="Your creator name"></label><label>YouTube channel<input id="channel" placeholder="https://youtube.com/@yourchannel"></label><label>Primary niche<select id="niche"><option value="">Choose your niche</option><option>Finance</option><option>Gospel / Christian</option><option>Gaming</option><option>Technology</option><option>Education</option><option>Business</option><option>Motivation</option><option>Lifestyle</option><option>Fitness</option><option>African Creators</option><option>Other</option></select></label><div id="profileStatus" class="form-success" hidden></div><button class="btn btn-primary" type="submit">Save profile →</button></form></section><div class="stats-stack"><div class="stat-card"><small>XP</small><b data-xp>0</b><span>New Creator</span></div><div class="stat-card"><small>REPUTATION</small><b data-rep>0</b><span>Build it through contribution</span></div><div class="stat-card"><small>COMMUNITY</small><b>Growing</b><span>Start making connections</span></div></div></div></main><script src="js/config.js"></script><script type="module">import {protectPage,bindLogout} from './js/app-static.js';protectPage();bindLogout();</script><script type="module" src="js/profile-static.js"></script></body></html>
