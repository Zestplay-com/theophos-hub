<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/app.css"><title>Submit content — Theophos Hub</title></head><body><main class="app-page"><header class="app-header"><a class="brand" href="index.html">theophos<span>hub</span></a><nav><a href="dashboard.html">Home</a><a href="discover.html">Discover</a><a class="active" href="submit.html">My content</a><a href="profile.html">Profile</a></nav></header><section class="app-shell"><div class="app-head"><div><div class="eyebrow">SHARE YOUR WORK</div><h2>Submit a video for genuine feedback.</h2><p>Tell the community what you want people to notice or help you improve.</p></div></div><div class="form-card"><label>Video title<input id="title" placeholder="Your video title"></label><label>YouTube video URL<input id="youtubeUrl" type="url" placeholder="https://youtube.com/watch?v=..."></label><label>Primary niche<select id="niche"><option>Finance</option><option>Gospel / Christian</option><option>Gaming</option><option>Technology</option><option>Education</option><option>Business</option><option>Motivation</option><option>Lifestyle</option><option>Fitness</option><option>African Creators</option><option>Other</option></select></label><label>Content type<select id="contentType"><option>Short</option><option>Long-form</option><option>Live</option><option>Other</option></select></label><label>What would you like feedback on?<textarea id="goal" placeholder="For example: Is the opening hook strong enough?"></textarea></label><p id="submitMessage" class="message"></p><button class="btn btn-primary" id="submitBtn">Submit for discovery →</button></div></section></main><script type="module" src="js/submit.js"></script></body></html>
