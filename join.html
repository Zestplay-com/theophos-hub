<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081225"><title>Join Theophos Hub</title><link rel="stylesheet" href="css/app.css"></head><body><main class="auth-page"><a class="brand" href="index.html">theophos<span>hub</span></a><section class="auth-card"><div class="eyebrow">JOIN THE CREATOR COMMUNITY</div><h1>Create your creator account.</h1><p>Start with your identity and niche. Your dashboard will help you decide what to do next.</p><form id="joinForm"><label>Creator name<input id="name" required placeholder="Your name or creator name" autocomplete="name"></label><label>Email<input id="email" type="email" required placeholder="you@example.com" autocomplete="email"></label><label>Password<input id="password" type="password" required minlength="6" placeholder="At least 6 characters" autocomplete="new-password"></label><label>Primary niche<select id="niche" required><option value="">Choose your niche</option><option>Finance</option><option>Gospel / Christian</option><option>Gaming</option><option>Technology</option><option>Education</option><option>Business</option><option>Motivation</option><option>Lifestyle</option><option>Fitness</option><option>Beauty</option><option>Comedy</option><option>African Creators</option><option>Other</option></select></label><div id="authError" class="form-error" hidden></div><button class="btn btn-primary full" type="submit">Create my account →</button></form><p class="switch">Already a creator? <a href="login.html">Sign in</a></p></section></main><script src="js/config.js"></script><script type="module" src="js/firebase.js"></script><script type="module" src="js/auth-static.js"></script></body></html>
