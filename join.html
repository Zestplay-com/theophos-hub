<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/app.css"><title>Join Theophos Hub</title></head><body><main class="auth-page"><a class="brand" href="index.html">theophos<span>hub</span></a><section class="auth-card"><div class="eyebrow">JOIN THE CREATOR COMMUNITY</div><h1>Build your creator profile.</h1><p>Tell us what you create so we can make discovery relevant to you.</p><label>Name<input id="name" placeholder="Your name or creator name"></label><label>Email<input id="email" type="email" autocomplete="email" placeholder="you@example.com"></label><label>Password<input id="password" type="password" autocomplete="new-password" placeholder="At least 6 characters"></label><label>Primary niche<select id="niche"><option value="">Choose your niche</option><option>Finance</option><option>Gospel / Christian</option><option>Gaming</option><option>Technology</option><option>Education</option><option>Business</option><option>Motivation</option><option>Lifestyle</option><option>Fitness</option><option>African Creators</option><option>Other</option></select></label><label>YouTube channel URL <span class="muted">(optional)</span><input id="channel" type="url" placeholder="https://youtube.com/@yourchannel"></label><p id="joinMessage" class="message"></p><button class="btn btn-primary full" id="joinBtn">Create my creator profile →</button><p class="auth-switch">Already a creator? <a href="login.html">Sign in</a></p></section></main><script src="js/firebase-config.js"></script><script type="module" src="js/auth.js"></script></body></html>
