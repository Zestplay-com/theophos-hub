name: Static Site Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check required static pages
        run: |
          set -e
          for file in index.html login.html join.html dashboard.html discover.html submit.html profile.html my-content.html start-here.html support.html; do
            test -f "$file"
          done
      - name: Check JavaScript syntax
        run: |
          set -e
          for file in js/*.js; do
            node --check "$file"
          done
      - name: Check Firebase configuration wiring
        run: |
          test -f js/config.js
          test -f js/firebase.js
